<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waler - Instagram Analytics</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 500px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: hsl(240, 10%, 3.9%);
      color: hsl(0, 0%, 98%);
    }

    .container {
      padding: 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid hsl(240, 3.7%, 15.9%);
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, hsl(142, 70%, 50.4%) 0%, hsl(142, 70%, 60%) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 13px;
      color: hsl(240, 5%, 64.9%);
      font-weight: 500;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: hsl(240, 3.7%, 15.9%);
      border: 1px solid hsl(240, 3.7%, 20%);
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      background: hsl(240, 3.7%, 18%);
      border-color: hsl(142, 70%, 50.4%, 0.3);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      color: hsl(142, 70%, 50.4%);
      font-family: 'Outfit', sans-serif;
    }

    .stat-label {
      font-size: 11px;
      color: hsl(240, 5%, 64.9%);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sync-status {
      background: hsl(240, 3.7%, 15.9%);
      border: 1px solid hsl(240, 3.7%, 20%);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .sync-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .sync-title {
      font-size: 14px;
      font-weight: 600;
      color: hsl(0, 0%, 98%);
    }

    .sync-badge {
      background: hsl(142, 70%, 50.4%, 0.15);
      color: hsl(142, 70%, 50.4%);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sync-info {
      font-size: 12px;
      color: hsl(240, 5%, 64.9%);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background: hsl(240, 3.7%, 15.9%);
      border: 1px solid hsl(240, 3.7%, 20%);
      border-radius: 10px;
      padding: 14px;
      color: hsl(0, 0%, 98%);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn:hover {
      background: hsl(240, 3.7%, 18%);
      border-color: hsl(142, 70%, 50.4%, 0.3);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: hsl(142, 70%, 50.4%);
      color: hsl(240, 10%, 3.9%);
      border: 1px solid hsl(142, 70%, 50.4%);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: hsl(142, 70%, 55%);
      border-color: hsl(142, 70%, 55%);
      box-shadow: 0 0 20px hsl(142, 70%, 50.4%, 0.3);
    }

    .not-authenticated {
      text-align: center;
      padding: 50px 20px;
    }

    .not-authenticated h2 {
      margin-bottom: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
    }

    .not-authenticated p {
      color: hsl(240, 5%, 64.9%);
      margin-bottom: 24px;
      line-height: 1.6;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
    }

    .spinner {
      border: 3px solid hsl(240, 3.7%, 15.9%);
      border-top: 3px solid hsl(142, 70%, 50.4%);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">Waler</div>
      <div class="subtitle">Instagram Analytics</div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Chargement...</div>
    </div>

    <div id="not-authenticated" class="not-authenticated" style="display: none;">
      <h2>🔒 Non connecté</h2>
      <p>Connectez-vous à FlowTrack pour commencer à tracker vos statistiques Instagram</p>
      <button class="btn btn-primary" id="login-btn">Se connecter</button>
    </div>

    <div id="authenticated" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="followers-count">0</div>
          <div class="stat-label">Nouveaux followers</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="unfollowers-count">0</div>
          <div class="stat-label">Unfollowers</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="blockers-count">0</div>
          <div class="stat-label">Blockers</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pending-count">0</div>
          <div class="stat-label">En attente</div>
        </div>
      </div>

      <div class="sync-status">
        <div class="sync-header">
          <div class="sync-title">Synchronisation</div>
          <div class="sync-badge" id="sync-badge">Actif</div>
        </div>
        <div class="sync-info" id="sync-info">Dernière sync: Jamais</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="sync-btn">Synchroniser maintenant</button>
        <button class="btn" id="dashboard-btn">Ouvrir le dashboard</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup-chrome.js"></script>
</body>
</html>
